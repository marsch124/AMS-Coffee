<meta charset="utf-8">
<title>Coffee Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Coffee Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Written for AMS Coffee 2.9. Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F4F6F7; --panel: #FFFFFF; --fg: #16232A; --muted: #5F7078; --line: #E2E8EA;
  --accent: #B45309; --accent-soft: #FBEBD3; --good: #15803D; --good-soft: #E3F4E8; --warn: #C2410C;
  --shadow: 0 18px 40px rgba(22,35,42,.2);
  --pbg:#F4F6F7; --pcard:#FFFFFF; --pink:#16232A; --pmuted:#5F7078; --pline:#E2E8EA; --pfield:rgba(120,120,128,.14);
  --ind:#B45309; --gt:#B45309; --band:#2E1A0B; --bz:#FF8C1A; --bz-ink:#4A2300; --bzt:#C2410C;
  --plum:#9C3D8C; --plumt:#9C3D8C; --navy:#2A5194; --grn:#30D158; --grn-ink:#0B3A17; --sess:#15803D;
  --yel:#FFD60A; --yel-ink:#3D3000; --wut:#A16207; --gold:#B7791F; --acc:#2F6FE0; --red:#DC3D43; --blue:#0A84FF; --pink2:#FF6FA8; --pink2-ink:#5A0F2E;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#FDBA74; --accent-soft:#3A2412; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#FDBA74; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#FDBA74; --accent-soft:#3A2412; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#FDBA74; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #B45309; color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #B45309; border-color: #B45309; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage button) { font: inherit; color: inherit }
:where(.stage input) { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 16px 84px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.sp { flex: 1 }
.tr { color: var(--gt) }

/* Tab bar: flat, three items, like the app */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--pcard); border-top: 1px solid var(--pline); display: flex; align-items: flex-start; padding-top: 6px; z-index: 30 }
.tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--pmuted); cursor: pointer; padding: 0 }
.tabs button svg { width: 24px; height: 24px }
.tabs button.on { font-weight: 600 }

/* Navigation */
.ltop { display: flex; align-items: center; min-height: 40px }
.nbk { display: flex; align-items: center; border: 0; background: none; color: var(--acc); font-size: 16px; padding: 4px 0; cursor: pointer; min-height: 40px }
.nbk svg { width: 20px; height: 20px }
.ltitle { margin: 0 0 8px; font-size: 32px; line-height: 1.12; font-weight: 700 }
.inl { display: flex; align-items: center; min-height: 40px; margin-bottom: 4px }
.inl b { flex: 1; text-align: center; font-size: 17px }
.inl .l, .inl .r { width: 80px; display: flex }
.inl .r { justify-content: flex-end }
.ib { border: 0; background: none; padding: 6px; cursor: pointer; display: grid; place-items: center; color: var(--gt); border-radius: 10px }
.ib svg { width: 22px; height: 22px }
.cap { color: var(--pmuted); font-size: 12.5px; margin: 4px 0 }

/* ---------- Pretend screens of Coffee (every class starts with cf-) ---------- */
.stage { --pbg:#FFF8E6; --pcard:rgba(255,255,255,.9); --pink:#472917; --pmuted:#54402F; --pline:rgba(71,41,23,.18); --pfield:rgba(255,255,255,.96);
  --mango:#FFB321; --apricot:#FF8C33; --bubble:#FF4D8C; --mint:#21D19E; --blue:#7066FF; --sky:#33C2FF; --grape:#B366FF; --danger:#C72E2E; --gt:#B45309 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage { --pbg:#1C1412; --pcard:rgba(42,34,31,.94); --pink:#F8F1E8; --pmuted:#DED5CC; --pline:rgba(248,241,232,.2); --pfield:#1B1613; --danger:#FF6B66 } }
:root[data-theme="dark"] .stage { --pbg:#1C1412; --pcard:rgba(42,34,31,.94); --pink:#F8F1E8; --pmuted:#DED5CC; --pline:rgba(248,241,232,.2); --pfield:#1B1613; --danger:#FF6B66 }
.stage { background: linear-gradient(135deg, color-mix(in srgb, var(--mango) 22%, var(--pbg)), var(--pbg) 45%, color-mix(in srgb, var(--bubble) 14%, var(--pbg))) }
.sbar { background: transparent }
.cf-title { display: flex; align-items: center; gap: 10px; font: 800 30px/1.1 ui-rounded, "SF Pro Rounded", var(--f-phone); margin: 6px 0 14px }
.cf-title svg { width: 34px; height: 34px; fill: none; stroke: var(--apricot); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
.cf-card { --t: var(--mint); border-radius: 26px; background: var(--pcard); border: 3px solid color-mix(in srgb, var(--t) 55%, transparent); box-shadow: 0 5px 0 color-mix(in srgb, var(--t) 30%, transparent); padding: 14px 16px; margin: 0 0 14px; display: block; width: 100%; text-align: left; color: var(--pink) }
.cf-h { font: 800 19px/1.2 ui-rounded, "SF Pro Rounded", var(--f-phone); margin: 0 0 6px }
.cf-soft { color: var(--pmuted); font: 700 15px/1.3 ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-sq { --t: var(--bubble); display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-radius: 22px; padding: 16px 20px; background: var(--t); color: #fff; font: 800 20px/1.1 ui-rounded, "SF Pro Rounded", var(--f-phone); box-shadow: 0 6px 0 color-mix(in srgb, var(--t) 45%, #000 12%); margin: 0 0 14px; cursor: pointer; text-align: left }
.cf-sq svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none }
.cf-sq.sm { width: auto; padding: 10px 16px; font-size: 16px; border-radius: 16px; margin: 0; box-shadow: 0 4px 0 color-mix(in srgb, var(--t) 45%, #000 12%) }
.cf-bn { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center }
.cf-bn b { display: block; font: 900 30px/1.1 ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-bn span { font: 700 14px var(--f-phone); color: var(--pmuted) }
.cf-chip { --t: var(--mint); display: inline-flex; gap: 5px; align-items: center; border-radius: 999px; padding: 4px 11px; font: 800 13.5px ui-rounded, "SF Pro Rounded", var(--f-phone); background: color-mix(in srgb, var(--t) 22%, transparent); color: var(--pink); white-space: nowrap }
.cf-chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--t); display: inline-block }
.cf-flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 }
.cf-ask { display: flex; flex-wrap: wrap; gap: 7px }
.cf-cap { border: 0; border-radius: 999px; padding: 8px 14px; font: 800 14.5px ui-rounded, "SF Pro Rounded", var(--f-phone); background: color-mix(in srgb, var(--grape) 22%, transparent); color: var(--pink); cursor: pointer }
.cf-cap.on { background: var(--grape); color: #fff }
.cf-bag { display: flex; gap: 12px }
.cf-ph { width: 64px; height: 84px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff }
.cf-ph svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.cf-rr { font: 800 12.5px var(--f-phone); letter-spacing: .06em; text-transform: uppercase; color: var(--pmuted) }
.cf-nm { font: 900 21px/1.15 ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-det { font: 800 16px/1.25 ui-rounded, "SF Pro Rounded", var(--f-phone); margin: 2px 0 }
.cf-meter { height: 12px; border-radius: 6px; background: var(--pline); overflow: hidden; margin: 6px 0 }
.cf-meter i { display: block; height: 100%; border-radius: 6px }
.cf-stars { color: var(--mango); letter-spacing: 1px; font-size: 16px }
.cf-add { position: absolute; left: 16px; right: 16px; bottom: 74px; z-index: 20 }
.cf-add .cf-sq { margin: 0 }
.cf-m { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px }
.cf-m button { --t: var(--blue); border: 0; border-radius: 16px; padding: 9px 13px; background: var(--t); color: #fff; font: 800 14px ui-rounded, "SF Pro Rounded", var(--f-phone); cursor: pointer; box-shadow: 0 3px 0 color-mix(in srgb, var(--t) 45%, #000 12%) }
.cf-fl { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; scrollbar-width: none }
.cf-fl button { border: 2px solid var(--pline); border-radius: 999px; padding: 6px 12px; background: transparent; color: var(--pink); font: 800 13.5px ui-rounded, "SF Pro Rounded", var(--f-phone); white-space: nowrap; cursor: pointer }
.cf-fl button.on { background: var(--pink); color: var(--pbg); border-color: var(--pink) }
.cf-sh { display: flex; align-items: center; gap: 8px; border-radius: 16px; background: var(--pfield); border: 2px solid var(--pline); padding: 8px 12px; margin: 0 0 10px }
.cf-sh svg { width: 18px; height: 18px; fill: none; stroke: var(--pmuted); stroke-width: 2.2; stroke-linecap: round }
.cf-sh input { flex: 1; min-width: 0; border: 0; background: none; font: 700 16px ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-found { font: 800 14.5px ui-rounded, "SF Pro Rounded", var(--f-phone); color: var(--pmuted); margin: 0 4px 10px }
.cf-lt { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none }
.cf-sr { display: flex; gap: 8px; align-items: center; margin: 0 0 6px }
.cf-pill { border-radius: 999px; padding: 3px 10px; font: 800 13px ui-rounded, "SF Pro Rounded", var(--f-phone); background: var(--pfield); border: 2px solid var(--pline) }
.cf-tabs button { font: 800 11px ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; border-radius: 22px 22px 0 0; z-index: 55; overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.3); background: linear-gradient(135deg, color-mix(in srgb, var(--mango) 22%, var(--pbg)), var(--pbg) 45%, color-mix(in srgb, var(--bubble) 14%, var(--pbg))) }
.cf-sheet .scr { inset: 0; padding: 14px 16px 100px }
.cf-sticky { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 10px 16px 18px; z-index: 6; background: color-mix(in srgb, var(--pbg) 88%, transparent) }
.cf-sticky .cf-sq { margin: 0; justify-content: center }
.cf-x { width: 56px; height: 56px; border-radius: 50%; border: 0; flex: none; background: color-mix(in srgb, var(--pink) 55%, transparent); color: #fff; display: grid; place-items: center; cursor: pointer }
.cf-x svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round }
.cf-fat { margin: 0 0 10px }
.cf-fat label { display: flex; gap: 8px; align-items: baseline; font: 800 15px ui-rounded, "SF Pro Rounded", var(--f-phone); color: var(--pmuted); margin: 0 0 3px }
.cf-fat label em { font-style: normal; color: var(--bubble); font-size: 13px }
.cf-fat input { width: 100%; border: 2px solid var(--pline); border-radius: 14px; background: var(--pfield); padding: 10px 12px; font: 700 17px ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-use { --t: var(--mint); border: 0; border-radius: 999px; background: var(--t); color: #fff; font: 800 13.5px ui-rounded, "SF Pro Rounded", var(--f-phone); padding: 5px 13px; cursor: pointer; margin-left: auto }
.cf-sg { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--pline); font: 700 14.5px ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-sg:first-of-type { border-top: 0 }
.cf-dial { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--pline) }
.cf-dial:first-child { border-top: 0 }
.cf-dial small { display: block; font: 800 14px ui-rounded, "SF Pro Rounded", var(--f-phone); color: var(--pmuted) }
.cf-dial b { font: 900 24px/1.1 ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-dial .pm { margin-left: auto; display: flex; gap: 6px }
.cf-dial .pm span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--blue) 18%, transparent); font: 800 18px var(--f-phone) }
.cf-clock { font: 900 44px/1 ui-rounded, "SF Pro Rounded", var(--f-phone); font-variant-numeric: tabular-nums; margin: 2px 0 }
.cf-sl { position: relative; height: 26px; margin: 2px 0 6px; cursor: pointer }
.cf-sl::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 5px; border-radius: 3px; background: var(--pline) }
.cf-sl i { position: absolute; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--t); margin-left: -10px; box-shadow: 0 1px 3px rgba(0,0,0,.3) }
.cf-sl .w { display: flex; justify-content: space-between; position: absolute; left: 0; right: 0; top: -17px; font: 800 14px ui-rounded, "SF Pro Rounded", var(--f-phone); color: var(--pmuted) }
.cf-lp { display: flex; gap: 8px; margin: 8px 0 }
.cf-lp button { flex: 1; border-radius: 18px; padding: 8px 0; background: transparent; border: 2px solid var(--pline); color: var(--pmuted); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 800 13.5px ui-rounded, "SF Pro Rounded", var(--f-phone); cursor: pointer }
.cf-lp button.on { border-width: 3px; border-color: var(--mint); background: color-mix(in srgb, var(--mint) 22%, transparent) }
.cf-lp .cf-lt { width: 30px; height: 30px }
.cf-adv { font: 900 21px/1.2 ui-rounded, "SF Pro Rounded", var(--f-phone); color: var(--sky) }
.cf-chart { margin: 4px 0 }
.cf-chart svg { width: 100%; height: 44px }
.cf-warn { color: var(--apricot) }
.cf-red { --t: var(--danger); background: transparent; color: var(--danger); border: 2px solid color-mix(in srgb, var(--danger) 60%, transparent); box-shadow: none; justify-content: center; font-size: 17px; padding: 12px }
.cf-fold { display: flex; align-items: center; justify-content: space-between; font: 800 18px ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-big { display: flex; align-items: center; gap: 12px }
.cf-big .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none }
.cf-big .ic svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round }
.cf-big b { display: block; font: 900 19px ui-rounded, "SF Pro Rounded", var(--f-phone) }
.cf-big small { display: block; font: 700 14px var(--f-phone); color: var(--pmuted) }
.cf-toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); background: #2F3B41; color: #fff; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 18px; z-index: 90; animation: pop .3s; max-width: 340px; text-align: center }
.cf-sig { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--pline); font: 600 13.5px/1.3 var(--f-phone) }
.cf-sig:first-child { border-top: 0 }
.cf-sig .k { width: 76px; flex: none; display: flex; justify-content: center; align-items: center; min-height: 24px; flex-wrap: wrap; gap: 3px }

/* Highlight: no position here (it would break absolutely placed boxes) */
.target { z-index: 2; animation: ring 1.6s ease-in-out infinite; border-radius: 9px }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 6px rgba(230,181,63,.35) } 50% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 11px rgba(230,181,63,0) } }

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('coffee-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null)
    || (S.sub ? q('sub-back') : S.sheet ? q('sheet-cancel') : S.page ? q('page-back') : null);

    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;

    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('phone')}<span>Now on your iPhone</span></button>

}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();

}
function renderStep() {

  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers(); clearTimeout(toastH);
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>

function next() {

}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {

  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ["Open Coffee. On Today tap the big \"Pull a shot\" button. Look for \"Same again: your best espresso on this bag\", then tap Start, then Stop, and watch the number change colour.", "Move the Sour ↔ Bitter slider, read \"Next time\", tap a light and tap \"Save it\". Look for the coach's line on Today.", "On Today tap \"Too bitter\" under \"What should I change?\", then \"It was lovely\".", "Open Beans. Look at the bold line under a bag's name (origin, process, roast) and its days-off-roast chip. Tap \"Add a bag\" and take a photo of a real bag: tap \"Use\" on a suggestion and look for \"from the label\".", "Open Brews and search for \"light\", then \"medium dark\", then \"green\".", "Open Settings → Your cups. Tap \"Save a cup\", name it and pour it. Look for the green tick. Tap \"Pour it back\" on one and read what would change, then cancel.", "In Settings tap \"Save a backup file\" and \"Choose where\". Look for \"Saved and proved\" and the line \"Last backup file\"."];
  let ticks = JSON.parse(store.get('coffee-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('coffee-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.menu) { S.menu = null; renderStage(); return; }
    if (S.sub) { act('sub-back'); return; }
    if (S.sheet) { act('sheet-cancel'); return; }
  }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
