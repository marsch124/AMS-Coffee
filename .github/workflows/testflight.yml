name: TestFlight

# Builds AMS Coffee and sends it to TestFlight, so a new version reaches the
# phone without touching the Mac. Started by hand from the Actions tab.
#
# Needs four repository secrets, made once in App Store Connect:
#   ASC_KEY_ID     the key's ID, ten characters
#   ASC_ISSUER_ID  the issuer ID shown above the key list
#   ASC_KEY_P8     the whole contents of the AuthKey_XXXXXXXXXX.p8 file
#   ASC_TEAM_ID    the ten-character Team ID from App Store Connect > Membership
#
# 🚨 The key must have the ADMIN role. An App Manager key uploads fine but
# cannot do the cloud signing in "Send it to TestFlight" below, and fails there
# with "Cloud signing permission error". This already cost a round on AMS PARA.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What is new in this build
        required: false
        default: ""

jobs:
  # A red suite must never reach the phone.
  tests:
    name: The suite has to pass first
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick a simulator the runner actually has
        run: |
          # Naming "iPhone 16" broke when GitHub rotated the runner image, and
          # taking the last line gave us an iPhone SE. Take the highest
          # numbered iPhone, so the device is both present and predictable.
          LINE=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone [0-9]" | sort -V | tail -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | tail -1)
          fi
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator:$(echo "$LINE" | sed -E 's/ *\(.*//')"

      - name: Unit tests and UI tests
        run: |
          xcodebuild test \
            -project AMSCoffee.xcodeproj \
            -scheme AMSCoffee \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  upload:
    name: Build and send to TestFlight
    needs: tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          # Apple refuses uploads built with an older SDK, so always take the
          # highest Xcode the image has.
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Check the secrets are there
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_P8"
          [ -z "$TEAM_ID" ] && missing="$missing ASC_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Number this build
        run: |
          # The version the app shows itself is the single source — Guide.swift.
          # TestFlight and the Version history pill can then never disagree.
          APP_VERSION=$(sed -n 's/.*static let appVersion = "\([^"]*\)".*/\1/p' \
            App/Sources/Guide.swift | head -1)
          if [ -z "$APP_VERSION" ]; then
            echo "Could not read Guide.appVersion from App/Sources/Guide.swift"
            exit 1
          fi
          echo "App version: $APP_VERSION"
          # Apple refuses a second upload of the same build number, so the run
          # number keeps them unique within a version.
          BUILD="$APP_VERSION.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" App/Config/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Config/Info.plist
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          # A browser textarea can normalise newlines to CRLF on submit, and
          # a PEM with carriage returns in it is a good way to make Apple say
          # something unhelpful. Strip them, and drop any blank lines.
          printf '%s\n' "$KEY" | tr -d '\r' | awk 'NF' > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      - name: Check the key is actually a key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # A mangled copy-paste of the .p8 into the secret shows up much later
          # as Apple's "Authentication failed: make sure a bearer token was
          # provided", forty seconds into an archive, which explains nothing.
          # Catch it here instead, in one second, and say what to do.
          F="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          if ! head -1 "$F" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_P8 does not start with -----BEGIN PRIVATE KEY-----."
            echo "The secret holds something other than the .p8 file's contents."
            exit 1
          fi
          if ! openssl pkey -in "$F" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid private key — the paste was"
            echo "truncated or its line breaks were lost. Re-copy the whole"
            echo "AuthKey_$KEY_ID.p8 file, including the BEGIN and END lines,"
            echo "into the secret."
            exit 1
          fi
          # Do NOT count lines. A .p8 is six lines and its last one has no
          # trailing newline, so wc -l says five — asserting "five lines"
          # failed a perfectly good key and cost a run.
          if ! tail -1 "$F" | grep -q "END PRIVATE KEY"; then
            echo "::error::ASC_KEY_P8 does not end with -----END PRIVATE KEY-----."
            echo "The paste was truncated. Copy the whole file."
            exit 1
          fi
          if [ "$(tr -cd '\r' < "$F" | wc -c | tr -d ' ')" != "0" ]; then
            echo "::error::carriage returns survived into the key file."
            exit 1
          fi
          echo "The key parses, starts and ends correctly, and has no stray characters."

      - name: Archive the app
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          # -allowProvisioningUpdates lets Apple register the bundle identifier
          # and its iCloud container on the first run.
          xcodebuild archive \
            -project AMSCoffee.xcodeproj \
            -scheme AMSCoffee \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/AMSCoffee.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log

      - name: Send it to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/AMSCoffee.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee build/export.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" build/export.log

      - name: Release it to the tester group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # An upload alone does not reach the phone. The build has to be
          # released to a group, and an internal group does not take new
          # builds by itself.
          ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          BUILD_VERSION="$BUILD" \
          APP_BUNDLE_ID=com.schabbauer.AMSCoffee \
          TESTER_GROUP=Martin \
          python3 tools/release-to-testers.py

      - name: Say what happened
        if: success()
        run: |
          echo "### Sent to TestFlight" >> $GITHUB_STEP_SUMMARY
          echo "AMS Coffee $APP_VERSION, build $BUILD — the same version the app's" >> $GITHUB_STEP_SUMMARY
          echo "Version history pill shows." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Apple processes it for a few minutes, then it appears in TestFlight on the phone." >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "What is new: ${{ github.event.inputs.notes }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Keep the logs when something fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"
