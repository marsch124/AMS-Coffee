name: Tests

# Every push runs the suite. A red run means the build is not fit to install.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show what we are building with
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator the runner actually has
        run: |
          # Hardcoding "iPhone 16" broke the moment GitHub rotated the runner
          # image. Ask the machine what it has instead, and use its UDID.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
import json, sys
devices = json.load(sys.stdin)["devices"]
found = [d for rt in devices for d in devices[rt]
         if d.get("isAvailable") and d["name"].startswith("iPhone")]
if not found:
    sys.exit("no iPhone simulator on this runner")
print(found[-1]["udid"], found[-1]["name"], sep="\t")
')
          echo "SIM_UDID=$(echo "$UDID" | cut -f1)" >> $GITHUB_ENV
          echo "Using simulator: $(echo "$UDID" | cut -f2)"

      - name: Unit tests and UI tests
        run: |
          xcodebuild test \
            -project AMSCoffee.xcodeproj \
            -scheme AMSCoffee \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
