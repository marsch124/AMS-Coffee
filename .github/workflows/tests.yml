name: Tests

# Every push runs the suite. A red run means the build is not fit to install.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show what we are building with
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator the runner actually has
        run: |
          # Naming "iPhone 16" broke when GitHub rotated the runner image, and
          # taking the last line gave us an iPhone SE. Take the highest
          # numbered iPhone, so the device is both present and predictable.
          LINE=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone [0-9]" | sort -V | tail -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | tail -1)
          fi
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator:$(echo "$LINE" | sed -E 's/ *\(.*//')"

      - name: Unit tests and UI tests
        run: |
          xcodebuild test \
            -project AMSCoffee.xcodeproj \
            -scheme AMSCoffee \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
