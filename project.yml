# XcodeGen spec — run `xcodegen generate`, then open AMSCoffee.xcodeproj.
name: AMSCoffee
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  AMSCoffee:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    entitlements:
      path: App/Config/AMSCoffee.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.schabbauer.AMSCoffee]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.schabbauer.AMSCoffee]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSCoffee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: Coffee
        CFBundleName: AMS Coffee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSUbiquitousContainers:
          iCloud.com.schabbauer.AMSCoffee:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: AMS Coffee
            NSUbiquitousContainerSupportedFolderLevels: None
  AMSCoffeeTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: AMSCoffee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSCoffeeTests
  AMSCoffeeUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: AMSCoffee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSCoffeeUITests
        TEST_TARGET_NAME: AMSCoffee
schemes:
  AMSCoffee:
    build:
      targets:
        AMSCoffee: all
    test:
      targets:
        - AMSCoffeeTests
        - AMSCoffeeUITests
